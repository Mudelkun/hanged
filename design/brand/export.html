<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hanged Brand Export</title>
<style>
  /* One asset per page, filling the window: headless Chrome screenshots it (Context/branding.md) */
  html, body { margin: 0; background: transparent; overflow: hidden; }
  svg { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<script src="../characters/rig.js"></script>
<script src="../characters/balloons.js"></script>
<script src="brand.js"></script>
<script>
/*
 * ?asset=icon     the app icon, 1024 × 1024, opaque (assets/icon.png, android foreground, favicon)
 * ?asset=splash   the native splash image: the blank wordmark on transparent, 1008 × 600 (3 × 336 points)
 *
 * The icon is the owner's art (icon-art.png, 1254 px with a rounded frame and a white margin).
 * It's cropped to the square inside the margin; iOS rounds the corners itself, so the art's
 * own rounded corners are filled with the same art zoomed in and blurred (soft matching colour,
 * no shapes), never left white.
 */
const asset = new URLSearchParams(location.search).get('asset');
const CROP = { x: 22, y: 8, size: 1210, radius: 265 }; // in icon-art.png pixels

const svg = {
  icon: () => {
    const { x, y, size: s, radius } = CROP, c = s / 2;
    const art = `<image href="icon-art.png" x="${-x}" y="${-y}" width="1254" height="1254"/>`;
    return `<svg viewBox="0 0 ${s} ${s}" preserveAspectRatio="none"><defs><clipPath id="in"><rect width="${s}" height="${s}" rx="${radius}"/></clipPath>` +
      `<filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="40"/></filter></defs>` +
      `<g filter="url(#soft)"><g transform="translate(${c} ${c}) scale(1.3) translate(${-c} ${-c})">${art}</g></g>` +
      `<g clip-path="url(#in)">${art}</g></svg>`;
  },
  splash: () => `<svg viewBox="${HangedBrand.BOX.join(' ')}">${HangedBrand.wordmark({ reveal: 0, pill: 0, bob: 0 })}</svg>`,
};
document.body.innerHTML = (svg[asset] || svg.icon)();
</script>
</body>
</html>
