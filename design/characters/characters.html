<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hanged Characters</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #fbf6ff; --card: #ffffff; --ink: #3a2b4d; --muted: #8a7a9e; --accent: #8b5cf6; --line: #ece3f7; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Fredoka', system-ui, sans-serif; }
  main { max-width: 1240px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { margin: 0; font-size: 34px; font-weight: 700; }
  .sub { color: var(--muted); margin: 6px 0 22px; font-size: 16px; }
  .controls { display: flex; flex-wrap: wrap; gap: 18px; margin-bottom: 22px; align-items: center; }
  .group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .group span { color: var(--muted); font-size: 14px; margin-right: 4px; }
  button { font: inherit; font-size: 14px; border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  .card { background: var(--card); border: 2px solid var(--line); border-radius: 24px; padding: 10px 10px 14px; text-align: center; }
  .card svg { width: 100%; height: auto; display: block; }
  .name { font-size: 20px; font-weight: 600; }
  .species { font-size: 14px; color: var(--muted); }
  h2 { margin: 40px 0 6px; font-size: 22px; }
  .strip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .strip .card { padding: 6px 6px 10px; }
  .strip .name { font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1>Hanged · Characters</h1>
  <p class="sub">10 characters on one shared rig. Same joints, parts and face anchors, so one animation drives them all.</p>

  <div class="controls">
    <div class="group" id="poses"><span>Pose</span></div>
    <div class="group" id="exprs"><span>Face</span></div>
    <div class="group"><button id="joints">Show joints</button></div>
  </div>

  <div class="grid" id="grid"></div>

  <h2>Shared expressions</h2>
  <p class="sub">The face set the hanging stages will step through. Shown on <b id="stripName"></b>; click any character above to switch.</p>
  <div class="strip" id="strip"></div>
</main>
<script src="rig.js"></script>
<script>
  const { render, CHARACTERS, POSES, EXPRESSIONS } = HangedRig;
  const params = new URLSearchParams(location.search);
  const state = { pose: params.get('pose') || 'idle', expr: params.get('expr') || 'happy', joints: params.has('joints'), focus: 'mochi' };

  function buttons(el, items, key) {
    items.forEach((v) => {
      const b = document.createElement('button');
      b.textContent = v;
      b.onclick = () => { state[key] = v; draw(); };
      b.dataset.v = v;
      el.appendChild(b);
    });
  }
  buttons(document.getElementById('poses'), Object.keys(POSES), 'pose');
  buttons(document.getElementById('exprs'), EXPRESSIONS, 'expr');
  document.getElementById('joints').onclick = () => { state.joints = !state.joints; draw(); };

  function draw() {
    document.querySelectorAll('#poses button').forEach((b) => b.classList.toggle('on', b.dataset.v === state.pose));
    document.querySelectorAll('#exprs button').forEach((b) => b.classList.toggle('on', b.dataset.v === state.expr));
    document.getElementById('joints').classList.toggle('on', state.joints);

    document.getElementById('grid').innerHTML = CHARACTERS.map((c) =>
      `<div class="card" data-id="${c.id}">${render(c, { pose: state.pose, expr: state.expr, showJoints: state.joints })}` +
      `<div class="name">${c.name}</div><div class="species">${c.species}</div></div>`).join('');
    document.querySelectorAll('#grid .card').forEach((el) => el.onclick = () => { state.focus = el.dataset.id; draw(); });

    const f = CHARACTERS.find((c) => c.id === state.focus);
    document.getElementById('stripName').textContent = f.name;
    document.getElementById('strip').innerHTML = EXPRESSIONS.map((e) =>
      `<div class="card">${render(f, { pose: e === 'scared' ? 'panic' : e === 'joy' ? 'cheer' : e === 'ko' ? 'dangle' : 'idle', expr: e })}<div class="name">${e}</div></div>`).join('');
  }
  draw();
</script>
</body>
</html>
